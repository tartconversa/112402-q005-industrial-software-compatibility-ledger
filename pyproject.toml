[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-upgrade-tracker"
version = "0.1.0"
description = "数控设备与边缘网关厂商公告/构建采集、兼容审核与升级建议系统"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
upgrade-tracker = "upgrade_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["upgrade_tracker*"]
